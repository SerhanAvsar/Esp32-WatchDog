<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcı Yönetimi | Güvenlik Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .admin-table th, .admin-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .admin-table th { background: rgba(255,255,255,0.05); font-weight: 600; color: #a0aec0; }
        .admin-table tr:hover { background: rgba(255,255,255,0.02); }
        .badge-admin { background: rgba(128, 90, 213, 0.2); color: #b794f4; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; }
        .badge-user { background: rgba(160, 174, 192, 0.2); color: #a0aec0; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; }
        .action-btns { display: flex; gap: 8px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: #1a202c; padding: 25px; border-radius: 12px; width: 400px; border: 1px solid rgba(255,255,255,0.1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; }
        .close-btn { cursor: pointer; color: #a0aec0; font-size: 1.5rem; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #a0aec0; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; }
    </style>
</head>
<body>
    <nav class="navbar glass-nav">
        <div class="nav-brand" style="display: flex; align-items: center; gap: 15px;">
            <a href="dashboard.html" class="btn secondary-btn small-btn" style="padding: 6px 12px; margin: 0; display: inline-flex; align-items: center; text-decoration: none;">← Geri</a>
            <span style="margin: 0; line-height: 1;">Kullanıcı Yönetimi</span>
        </div>
        <div class="nav-actions">
            <div class="notification-bell" onclick="window.location.href='logs.html'" title="Bildirimler">
                🔔
                <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
            </div>
            <button id="addUserBtn" class="btn primary-btn small-btn">Yeni Kullanıcı Ekle</button>
        </div>
    </nav>

    <main class="dashboard-wrapper fade-in">
        <div class="glass-card table-container">
            <div id="loadingIndicator" class="loading-spinner"></div>
            
            <table class="admin-table hidden" id="usersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Kullanıcı Adı</th>
                        <th>Yetki Seviyesi</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>
                <tbody id="usersList">
                    <!-- Data will be injected here -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Add/Edit User Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Kullanıcı Ekle</h3>
                <span class="close-btn" id="closeModal">&times;</span>
            </div>
            <form id="userForm">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="mUsername" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Şifre <span id="passwordHint" style="font-size: 0.8rem; color: #718096;">(Değiştirmek istemiyorsanız boş bırakın)</span></label>
                    <input type="password" id="mPassword">
                </div>
                <div class="form-group">
                    <label>Yetki</label>
                    <select id="mRole">
                        <option value="0">Standart Kullanıcı</option>
                        <option value="1">Yönetici (Admin)</option>
                    </select>
                </div>
                <div id="modalError" class="error-msg" style="margin-bottom: 15px;"></div>
                <button type="submit" class="btn primary-btn" style="width: 100%;">Kaydet</button>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
