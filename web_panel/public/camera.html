<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Kamera | Güvenlik Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar glass-nav">
        <div class="nav-brand" style="display: flex; align-items: center; gap: 15px;">
            <a href="dashboard.html" class="btn secondary-btn small-btn" style="padding: 6px 12px; margin: 0; display: inline-flex; align-items: center; text-decoration: none;">← Geri</a>
            <span style="margin: 0; line-height: 1;">ESP32-CAM Canlı Akış</span>
        <div class="nav-actions">
            <div class="notification-bell" onclick="window.location.href='logs.html'" title="Bildirimler">
                🔔
                <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
            </div>
        </div>
    </nav>

    <main class="dashboard-wrapper fade-in block-center">
        <div class="camera-container glass-card">
            <div class="camera-header">
                <h3>Kamera 1 - Ana Giriş</h3>
                <span class="status-badge online">● Canlı Yayın</span>
            </div>
            
            <div class="stream-wrapper">
                <!-- ESP32-CAM stream will be loaded here. Replace the IP address with your actual ESP32 IP -->
                <img id="stream" src="http://192.168.1.100:81/stream" alt="Kamera bağlantısı bekleniyor. Lütfen ESP32-CAM IP adresini kontrol edin." class="stream-img">
            </div>

            <div class="camera-controls">
                <div class="input-group inline-group" style="margin-bottom: 20px;">
                    <label for="espIp">ESP32 IP Adresi:</label>
                    <input type="text" id="espIp" value="http://192.168.1.100:81/stream">
                    <button id="updateIpBtn" class="btn primary-btn small-btn">Uygula</button>
                </div>

                <!-- Kayıt Paneli (Sadece Admin Görecek) -->
                <div id="recordingPanel" class="input-group inline-group hidden" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
                    <label for="recordDuration" style="color: #ef4444;">Kayıt Süresi (Dk): <br><small style="color:var(--text-muted);font-weight:normal;">0 = Süresiz</small></label>
                    <input type="number" id="recordDuration" value="5" min="0" max="120" style="width: 80px;">
                    <button id="recordBtn" class="btn primary-btn small-btn" style="background-color: #ef4444; box-shadow: 0 4px 14px 0 rgba(239, 68, 68, 0.39);">Kayıt Başlat</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/camera.js"></script>
</body>
</html>
