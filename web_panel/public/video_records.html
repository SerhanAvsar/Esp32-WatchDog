<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Kayıtları | Güvenlik Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .table-container {
            background: rgba(49, 130, 206, 0.05); /* Slight blue tint */
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(49, 130, 206, 0.2);
            margin-top: 20px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
        }
        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        th {
            font-weight: 600;
            color: #63b3ed;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        tr:hover {
            background: rgba(49, 130, 206, 0.05);
        }
        .download-btn {
            background: rgba(49, 130, 206, 0.2);
            color: #63b3ed;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(49, 130, 206, 0.5);
            transition: all 0.3s;
            display: inline-block;
        }
        .download-btn:hover {
            background: rgba(49, 130, 206, 0.5);
            color: #fff;
        }
        .no-data {
            text-align: center;
            padding: 30px;
            color: #a0aec0;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #63b3ed;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            background: rgba(49, 130, 206, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(49, 130, 206, 0.2);
        }
        .back-link:hover {
            color: #fff;
            background: rgba(49, 130, 206, 0.3);
        }
    </style>
</head>
<body class="dark-theme">
    <nav class="navbar">
        <div class="nav-brand">
            <span class="logo-icon">🛡️</span>
            <h1>ESP32 Güvenlik Ağı</h1>
        </div>
        <div class="nav-menu">
            <span id="userGreeting" class="user-greeting"></span>
            <div class="notification-bell">
                <span class="bell-icon">🔔</span>
                <span class="notification-badge hidden" id="notifBadge">0</span>
            </div>
            <button id="logoutBtn" class="btn danger-btn small-btn">Çıkış Yap</button>
        </div>
    </nav>

    <main class="dashboard-wrapper fade-in block-center">
        <div class="glass-card" style="width: 100%; max-width: 900px; padding: 30px;">
            <a href="dashboard.html" class="back-link">← Panele Dön</a>
            
            <div class="camera-header">
                <h3>🎞️ Video Kayıtları</h3>
                <span class="status-badge online" style="background: rgba(49, 130, 206, 0.2); color: #63b3ed;">Yalnızca Yöneticiler</span>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Dosya Adı</th>
                            <th>Kayıt Boyutu</th>
                            <th>Oluşturulma Tarihi</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTableBody">
                        <tr>
                            <td colspan="4" class="no-data">Kayıtlar yükleniyor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Video Player Container (Hidden initially, moved dynamically) -->
    <table style="display: none;">
        <tr id="videoPlayerRow">
            <td colspan="4" style="padding: 0; border: none;">
                <div id="videoPlayerContainer" class="glass-card" style="margin: 10px; padding: 20px; background: rgba(0,0,0,0.2); border: 1px solid rgba(49, 130, 206, 0.3);">
                    <div class="camera-header" style="margin-bottom: 15px;">
                        <h3 id="modalTitle">Video Oynatılıyor</h3>
                        <span class="status-badge" style="background: rgba(239, 68, 68, 0.2); color: #ef4444; cursor: pointer;" id="closeModalBtn">Kapat ✖</span>
                    </div>
                    <div class="stream-wrapper" style="position: relative; background: #000; border-radius: 8px; min-height: 300px; display: flex; align-items: center; justify-content: center;">
                        <p id="playerLoading" style="color: white; position: absolute;">Yükleniyor...</p>
                        <img id="playerImg" src="" alt="" style="max-width: 100%; border-radius: 8px; display: none;">
                    </div>
                    
                    <!-- Video Controls -->
                    <div id="videoControls" style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 15px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; display: none;">
                        <button id="playPauseBtn" class="btn primary-btn small-btn" style="background-color: #3182ce; width: 50px;">⏸</button>
                        
                        <div style="display: flex; align-items: center; gap: 10px; color: #e2e8f0;">
                            <label for="speedSelect" style="font-size: 0.9rem;">Hız:</label>
                            <select id="speedSelect" style="background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 5px; border-radius: 4px; outline: none;">
                                <option value="0.25">0.25x</option>
                                <option value="0.50">0.50x</option>
                                <option value="0.75">0.75x</option>
                                <option value="1.0" selected>1.0x (Normal)</option>
                                <option value="1.25">1.25x</option>
                                <option value="1.50">1.50x</option>
                                <option value="1.75">1.75x</option>
                                <option value="2.0">2.0x</option>
                            </select>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
    </table>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/video_records.js"></script>
</body>
</html>
