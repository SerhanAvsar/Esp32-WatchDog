<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaz ve Yangın Alarmı | Güvenlik Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .table-container {
            background: rgba(229, 62, 62, 0.05); /* Slight red tint */
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 62, 62, 0.2);
            margin-top: 20px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
        }
        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        th {
            font-weight: 600;
            color: #fc8181;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        tr:hover {
            background: rgba(229, 62, 62, 0.05);
        }
        .danger-badge {
            background: rgba(229, 62, 62, 0.2);
            color: #fc8181;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(229, 62, 62, 0.5);
        }
        .no-data {
            text-align: center;
            padding: 30px;
            color: #a0aec0;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #fc8181;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: #e53e3e;
        }
        .refresh-btn {
            background: none;
            border: 1px solid rgba(229, 62, 62, 0.4);
            color: #fc8181;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            float: right;
            margin-bottom: 15px;
        }
        .refresh-btn:hover {
            background: rgba(229, 62, 62, 0.2);
        }
    </style>
</head>
<body>
    <nav class="navbar glass-nav" style="border-bottom: 1px solid rgba(229,62,62,0.3);">
        <div class="nav-brand">
            <div class="logo-icon small-icon" style="background: linear-gradient(135deg, #e53e3e 0%, #fc8181 100%);"></div>
            <span>Güvenlik Sistemi</span>
        </div>
        <div class="nav-actions">
            <button id="logoutBtn" class="btn secondary-btn small-btn">Çıkış Yap</button>
        </div>
    </nav>

    <main class="dashboard-wrapper fade-in">
        <header class="page-header">
            <a href="dashboard.html" class="back-link">← Panele Dön</a>
            <h2 style="color: #fc8181;">🔥 Gaz ve Yangın Uyarısı</h2>
            <p>MQ-2 Sensöründen alınan güncel duman/gaz algılama kayıtları.</p>
        </header>

        <button id="refreshBtn" class="refresh-btn">🔄 Yenile</button>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Olay Tarihi / Saati</th>
                        <th>Gaz Seviyesi (Ölçüm)</th>
                        <th>Durum</th>
                    </tr>
                </thead>
                <tbody id="gasTableBody">
                    <tr>
                        <td colspan="4" class="no-data">Yükleniyor...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/gas.js"></script>
</body>
</html>
